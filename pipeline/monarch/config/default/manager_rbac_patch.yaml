- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD_SERVICE_ACCOUNT
      valueFrom:
        fieldRef:
          fieldPath: spec.serviceAccountName
    - name: MONARCH_SHADOW_WORKLOAD_CLUSTER_ROLE
      value: monarch-shadow-workload-role
