apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  labels:
    app.kubernetes.io/name: monarch
    app.kubernetes.io/managed-by: kustomize
  name: shadowtest-sample
  namespace: default
spec:
  targetDeployment: my-prod-app
  targetNamespace: default
  oldImage: ghcr.io/org/app:v1
  newImage: ghcr.io/org/app:v2
  servicePort: 8080
  applicationPort: 8081
  # record (default) | replay. Record captures to S3 without ABC pods; replay
  # runs ABC against a pinned session. Bats fixtures that omit mode/storage
  # must be updated to match this contract.
  mode: record
  # sessionID: session-...   # required for replay (or set status.currentSessionID)
  # Required BYOB S3 storage. Local MinIO is provisioned by
  # ./testing/tools/e2e-reset-kind.sh (not by Monarch). Credentials Secret
  # shadow-diff-s3 is created in this namespace by that script; Monarch copies
  # it into the shadow namespace for pod secretKeyRef.
  storage:
    type: s3
    bucketName: shadow-diff-local
    endpoint: http://minio-service.monarch-system.svc.cluster.local:9000
    region: us-east-1
    credentialsSecretRef:
      name: shadow-diff-s3
    retentionPolicy: Retain
  # Optional: Igris listener ports (default: servicePort → http)
  # inputs:
  #   - port: 8080
  #     addon: http
  # igris:
  #   image: igris-http:latest   # optional; Monarch resolves igris-http:{tag} from MONARCH_MODE
  # Ephemeral dependencies: one isolated instance per shadow role (control-a, control-b, candidate).
  # Monarch injects envVarInjection as host:port, e.g. redis-control-a.<shadow-ns>.svc.cluster.local:6379
  # dependencies:
  #   - name: redis
  #     image: redis:7-alpine
  #     port: 6379
  #     envVarInjection: REDIS_ADDR
