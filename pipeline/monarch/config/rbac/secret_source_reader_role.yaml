# get-only Secret reader, bound into ShadowTest CR namespaces at install time
# (Helm monarch.secretSourceNamespaces / e2e RoleBinding in default). No list/watch.
# The manager SA must not bind this ClusterRole — install-time RoleBindings only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: monarch
    app.kubernetes.io/managed-by: kustomize
  name: secret-source-reader
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
