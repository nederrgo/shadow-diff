# Namespaced get of BERU_DB_SECRET (default monarch-system/beru-postgres).
# kustomize namespace + namePrefix map this into monarch-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: monarch
    app.kubernetes.io/managed-by: kustomize
  name: beru-db-secret-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - beru-postgres
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: monarch
    app.kubernetes.io/managed-by: kustomize
  name: beru-db-secret-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: beru-db-secret-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
