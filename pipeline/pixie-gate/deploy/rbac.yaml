apiVersion: v1
kind: ServiceAccount
metadata:
  name: pixie-gate
  namespace: monarch-system
  labels:
    app.kubernetes.io/name: pixie-gate
    app.kubernetes.io/component: pixie-gateway
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pixie-gate
  labels:
    app.kubernetes.io/name: pixie-gate
rules:
  - apiGroups: ["engine.shadow-diff.io"]
    resources: ["pixiestreamrules"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["engine.shadow-diff.io"]
    resources: ["pixiestreamrules/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pixie-gate
  labels:
    app.kubernetes.io/name: pixie-gate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pixie-gate
subjects:
  - kind: ServiceAccount
    name: pixie-gate
    namespace: monarch-system
