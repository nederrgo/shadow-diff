apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixie-gate
  namespace: monarch-system
  labels:
    app.kubernetes.io/name: pixie-gate
    app.kubernetes.io/component: pixie-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pixie-gate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pixie-gate
        app.kubernetes.io/component: pixie-gateway
    spec:
      serviceAccountName: pixie-gate
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pixie-gate
          image: pixie-gate:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: HOME
              value: /home/nonroot
            - name: PIXIE_GATE_STATE_DIR
              value: /tmp/pixie-gate
            - name: PIXIE_PXL_TEMPLATE_DIR
              value: /etc/pixie-gate
            - name: PIXIE_EXPORT_INTERVAL_SEC
              value: "3"
            - name: PIXIE_GATE_HEALTH_ADDR
              value: ":8081"
            - name: PIXIE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pixie-gate
                  key: PIXIE_API_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: templates
              mountPath: /etc/pixie-gate
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
      volumes:
        - name: templates
          configMap:
            name: pixie-gate
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
