apiVersion: v1
kind: Namespace
metadata:
  name: kaisel-system
  labels:
    app.kubernetes.io/name: kaisel
    # CAP_BPF + CAP_NET_RAW + CAP_PERFMON require the privileged PSA level.
    # The DaemonSet still drops all other capabilities and avoids privileged:true.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
