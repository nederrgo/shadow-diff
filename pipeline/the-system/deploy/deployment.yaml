apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-system
  namespace: monarch-system
  labels:
    app.kubernetes.io/name: the-system
    app.kubernetes.io/part-of: shadow-diff
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: the-system
  template:
    metadata:
      labels:
        app.kubernetes.io/name: the-system
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: the-system
          image: the-system:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - "ALL"
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
