{{- if .Values.theSystem.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shadow-diff.theSystemName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadow-diff.labels" . | nindent 4 }}
    app.kubernetes.io/name: the-system
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.theSystem.replicaCount }}
  selector:
    matchLabels:
      {{- include "shadow-diff.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: the-system
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "shadow-diff.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: the-system
        app.kubernetes.io/component: ui
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/the-system/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: the-system
          image: {{ include "shadow-diff.theSystemImage" . }}
          imagePullPolicy: {{ include "shadow-diff.pullPolicy" (list . .Values.theSystem.image.pullPolicy) }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.theSystem.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "shadow-diff.theSystemName" . }}-nginx
{{- end }}
