{{- if .Values.postgres.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shadow-diff.postgresSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadow-diff.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "shadow-diff.name" . }}
    app.kubernetes.io/component: postgres-credentials
type: Opaque
stringData:
  DB_HOST: {{ .Values.postgres.host | quote }}
  DB_PORT: {{ .Values.postgres.port | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
  DB_NAME: {{ .Values.postgres.name | quote }}
  DB_SSLMODE: {{ .Values.postgres.sslMode | quote }}
{{- end }}
