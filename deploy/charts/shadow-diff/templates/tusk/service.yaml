{{- if .Values.tusk.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shadow-diff.tuskName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadow-diff.labels" . | nindent 4 }}
    app.kubernetes.io/name: tusk
    app.kubernetes.io/component: bff
spec:
  type: {{ .Values.tusk.service.type }}
  ports:
    - name: http
      port: {{ .Values.tusk.service.port }}
      protocol: TCP
      targetPort: http
  selector:
    {{- include "shadow-diff.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: tusk
    app.kubernetes.io/component: bff
{{- end }}
