{{- if .Values.aws.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shadow-diff.s3SecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadow-diff.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "shadow-diff.name" . }}
    app.kubernetes.io/component: s3-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.aws.secretAccessKey | quote }}
  AWS_REGION: {{ .Values.aws.region | quote }}
  {{- if .Values.aws.s3Bucket }}
  S3_BUCKET: {{ .Values.aws.s3Bucket | quote }}
  {{- end }}
{{- end }}
