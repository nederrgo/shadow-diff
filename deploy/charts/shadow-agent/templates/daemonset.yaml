apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "shadow-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadow-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "shadow-agent.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "shadow-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shadow-agent.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # hostNetwork: AF_PACKET on the node sees ingress traffic entering the node.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      {{- with .Values.kaisel.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kaisel.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kaisel.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kaisel
          image: {{ include "shadow-agent.image" . }}
          imagePullPolicy: {{ include "shadow-agent.pullPolicy" . }}
          args:
            - -iface=$(KAISEL_IFACE)
            - -log-bodies=$(KAISEL_LOG_BODIES)
          env:
            - name: KAISEL_IFACE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "shadow-agent.fullname" . }}-config
                  key: iface
            - name: KAISEL_LOG_BODIES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "shadow-agent.fullname" . }}-config
                  key: logBodies
          securityContext:
            # Caps only — not privileged:true. See pipeline/kaisel/deploy/daemonset.yaml.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: Unconfined
            capabilities:
              add:
                - BPF
                - NET_RAW
                - PERFMON
              drop:
                - ALL
          resources:
            {{- toYaml .Values.kaisel.resources | nindent 12 }}
