# HTTP ingress RMQ Go E2E fixture.
apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  name: bats-http-ingress-rmq-go
  namespace: default
spec:
  targetDeployment: http-rmq-go-prod

  oldImage: http-rmq-go-worker:dev
  newImage: http-rmq-go-worker:dev

  servicePort: 8888
  applicationPort: 8080

  inputs:
    - port: 8888
      driver: http_request

  dependencies:
    - name: rabbitmq
      type: rabbitmq
      envVarInjection: AMQP_URL
    - name: mongodb
      type: mongodb
      image: mongo:4.4
      envVarInjection: MONGO_URL
