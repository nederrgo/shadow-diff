# Prod target for Kind Kaisel smoke (Phase 1).
# Same shape as kaisel-capture; prod Service is NodePort 30080 to match
# testing/bats/kind/config.yaml extraPortMappings (host 18080 → 30080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaisel-capture-prod
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaisel-capture-prod
  template:
    metadata:
      labels:
        app: kaisel-capture-prod
    spec:
      containers:
        - name: app
          image: egress-test-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DEPENDENCY_BASE_URL
              value: http://kaisel-egress-dep:8080
            - name: DEPENDENCY_CLUSTER_URL
              value: http://kaisel-egress-dep.default.svc.cluster.local:8080
            - name: EXTERNAL_BASE_URL
              value: http://httpbin.org/get
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: kaisel-capture-prod
  namespace: default
spec:
  type: NodePort
  selector:
    app: kaisel-capture-prod
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaisel-egress-dep
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaisel-egress-dep
  template:
    metadata:
      labels:
        app: kaisel-egress-dep
    spec:
      containers:
        - name: app
          image: egress-test-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: kaisel-egress-dep
  namespace: default
spec:
  selector:
    app: kaisel-egress-dep
  ports:
    - port: 8080
      targetPort: 8080
