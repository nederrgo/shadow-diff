apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  name: bats-kaisel-capture
  namespace: default
spec:
  targetDeployment: kaisel-capture-prod
  targetNamespace: default
  # control-a/b use target Deployment image (nginx); candidate uses newImage.
  oldImage: nginx:alpine
  newImage: nginx:alpine
  servicePort: 8080
  applicationPort: 80
  samplePercentage: 100
