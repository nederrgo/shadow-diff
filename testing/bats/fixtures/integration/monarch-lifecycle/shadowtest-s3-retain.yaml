# Record-mode ShadowTest with retentionPolicy=Retain (S3 kept on CR delete).
apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  name: bats-monarch-s3-retain
  namespace: default
spec:
  targetDeployment: monarch-lifecycle-target
  newImage: nginx:alpine
  mode: record
  storage:
    type: s3
    bucketName: shadow-diff-local
    endpoint: http://minio-service.monarch-system.svc.cluster.local:9000
    region: us-east-1
    credentialsSecretRef:
      name: shadow-diff-s3
    retentionPolicy: Retain
