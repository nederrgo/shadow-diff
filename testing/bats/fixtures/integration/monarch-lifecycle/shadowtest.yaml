# ShadowTest for Monarch lifecycle integration tests (delete / re-apply / recreate).
# No heavy dependencies — keeps Progressing→Ready windows short enough for four
# apply/delete cycles in one suite. Monarch still provisions beru-local, igris,
# three shadow roles, shop, and KaiselRule when ports match.
apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  name: bats-monarch-lifecycle
  namespace: default
spec:
  targetDeployment: monarch-lifecycle-target
  newImage: nginx:alpine
