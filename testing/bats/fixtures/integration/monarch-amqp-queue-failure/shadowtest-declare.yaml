# Record-mode ShadowTest used with a pre-created conflicting prod queue so
# Monarch's QueueDeclare hits PRECONDITION_FAILED → markBootFailed.
apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  name: bats-monarch-amqp-qfail-declare
  namespace: default
spec:
  targetDeployment: amqp-qfail-target
  newImage: nginx:alpine
  mode: record
  inputs:
    - driver: rabbitmq_message
      amqp:
        prodUrl: amqp://rmq-prod-broker.default.svc.cluster.local:5672/
        credentialsSecretRef:
          name: rmq-prod-creds
        exchange: orders
        routingKey: order.created
        targetDependency: rabbitmq
  dependencies:
    - name: rabbitmq
      type: rabbitmq
      envVarInjection: AMQP_URL
  storage:
    type: s3
    bucketName: shadow-diff-local
    endpoint: http://minio-service.monarch-system.svc.cluster.local:9000
    region: us-east-1
    credentialsSecretRef:
      name: shadow-diff-s3
    retentionPolicy: Retain
