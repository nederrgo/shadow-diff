# ShadowTest for Spike Guard integration test — small maxQPSPerPod so a modest
# burst of concurrent requests reliably exceeds IGRIS_MAX_CONCURRENCY.
apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  name: bats-spike-guard
  namespace: default
spec:
  targetDeployment: monarch-spike-guard-target
  newImage: nginx:alpine
  mode: replay
  sessionID: session-spike-empty
  maxQPSPerPod: 5
  storage:
    type: s3
    bucketName: shadow-diff-local
    endpoint: http://minio-service.monarch-system.svc.cluster.local:9000
    region: us-east-1
    credentialsSecretRef:
      name: shadow-diff-s3
    retentionPolicy: Retain
