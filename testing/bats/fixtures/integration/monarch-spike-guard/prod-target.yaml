# Minimal prod target for the Spike Guard integration test.
# Monarch reads this Deployment's container ports/image during ShadowTest
# reconciliation; no traffic is ever sent to it (traffic goes straight to igris).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monarch-spike-guard-target
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monarch-spike-guard-target
  template:
    metadata:
      labels:
        app: monarch-spike-guard-target
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: monarch-spike-guard-target
  namespace: default
spec:
  selector:
    app: monarch-spike-guard-target
  ports:
    - port: 8888
      targetPort: 80
