# ShadowTest for Beru verdict UI seed scenarios (beru-local + dashboard only).
# No live traffic / Kaisel — tests POST /api/v1/debug/seed-reports.
apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  name: bats-beru-verdict-ui
  namespace: default
spec:
  targetDeployment: monarch-integ-target
  newImage: nginx:alpine
  storage:
    type: s3
    bucketName: shadow-diff-local
    endpoint: http://minio-service.monarch-system.svc.cluster.local:9000
    region: us-east-1
    credentialsSecretRef:
      name: shadow-diff-s3
    retentionPolicy: Retain
