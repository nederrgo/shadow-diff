# Baseline ShadowTest with no dependencies — applied first, then patched.
apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  name: bats-monarch-deps-update
  namespace: default
spec:
  targetDeployment: monarch-deps-update-target
  newImage: nginx:alpine
  mode: replay
  sessionID: session-deps-empty
  storage:
    type: s3
    bucketName: shadow-diff-local
    endpoint: http://minio-service.monarch-system.svc.cluster.local:9000
    region: us-east-1
    credentialsSecretRef:
      name: shadow-diff-s3
    retentionPolicy: Retain
