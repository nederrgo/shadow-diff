# Minimal prod target for Monarch HTTP input integration tests.
# Monarch reads this Deployment's container ports during ShadowTest reconciliation
# to confirm the input port matches (HTTP ingress capture port-match check).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monarch-integ-target
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monarch-integ-target
  template:
    metadata:
      labels:
        app: monarch-integ-target
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: monarch-integ-target
  namespace: default
spec:
  selector:
    app: monarch-integ-target
  ports:
    - port: 8888
      targetPort: 80
