# ShadowTest for Monarch HTTP input integration tests (replay stack).
# ABC roles + deps + igris-http + Shop; Kaisel disabled in replay.
# Monarch derives oldImage / applicationPort / servicePort from the prod target.
apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  name: bats-monarch-http-input
  namespace: default
spec:
  targetDeployment: monarch-integ-target
  newImage: nginx:alpine
  mode: replay
  sessionID: session-http-input-empty

  storage:
    type: s3
    bucketName: shadow-diff-local
    endpoint: http://minio-service.monarch-system.svc.cluster.local:9000
    region: us-east-1
    credentialsSecretRef:
      name: shadow-diff-s3
    retentionPolicy: Retain

  dependencies:
    - name: rabbitmq
      type: rabbitmq
      envVarInjection: AMQP_URL
    - name: mongodb
      type: mongodb
      image: mongo:4.4
      envVarInjection: MONGO_URL
