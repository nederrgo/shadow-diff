# ShadowTest for Monarch HTTP input integration tests.
# Monarch derives oldImage from the prod target, applicationPort from its container
# port (nginx:alpine → 80), and picks a conflict-free servicePort automatically.
# Deploys igris-http, KaiselRule, and both mongo + rabbitmq dependency pods per role.
apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  name: bats-monarch-http-input
  namespace: default
spec:
  targetDeployment: monarch-integ-target
  newImage: nginx:alpine

  dependencies:
    - name: rabbitmq
      type: rabbitmq
      envVarInjection: AMQP_URL
    - name: mongodb
      type: mongodb
      image: mongo:4.4
      envVarInjection: MONGO_URL
