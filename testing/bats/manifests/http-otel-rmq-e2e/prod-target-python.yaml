apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-rmq-python-prod
  namespace: default
  labels:
    app: http-rmq-python-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-rmq-python-prod
  template:
    metadata:
      labels:
        app: http-rmq-python-prod
    spec:
      containers:
        - name: app
          image: http-rmq-python-worker:dev
          imagePullPolicy: Never
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: RMQ_EGRESS_EXCHANGE
              value: egress-events
            - name: RMQ_EGRESS_ROUTING_KEY
              value: order.egress
            - name: AMQP_URL
              value: amqp://guest:guest@rmq-prod-broker.default.svc.cluster.local:5672/
            - name: MONGO_URL
              value: mongodb://mongo-prod.default.svc.cluster.local:27017
---
apiVersion: v1
kind: Service
metadata:
  name: http-rmq-python-prod
  namespace: default
spec:
  selector:
    app: http-rmq-python-prod
  ports:
    - port: 8080
      targetPort: 8080
