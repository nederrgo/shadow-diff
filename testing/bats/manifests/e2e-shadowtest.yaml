# ShadowTest tuned for local Kind E2E: prod (port 80) -> Kaisel -> Igris:80 -> S3 (record).
#
# mode=record: Kaisel + Igris + Shop (+ beru-local); no ABC shadow pods.
# storage is required (BYOB). Local MinIO is provisioned by e2e-reset-kind.sh.
#
# Apply:
#   kubectl apply -f testing/bats/manifests/e2e-shadowtest.yaml
#   kubectl apply -f testing/bats/manifests/e2e-prod-app.yaml   # optional: align prod with echo on :80
#
apiVersion: engine.shadow-diff.io/v1alpha1
kind: ShadowTest
metadata:
  name: my-app-shadow
  namespace: default
spec:
  targetDeployment: my-prod-app

  mode: record
  # sessionID: optional pin; Monarch mints status.currentSessionID when unset

  # Required BYOB S3. Secret shadow-diff-s3 is created in this namespace by
  # testing/tools/e2e-reset-kind.sh (copied into the shadow ns by Monarch).
  storage:
    type: s3
    bucketName: shadow-diff-local
    endpoint: http://minio-service.monarch-system.svc.cluster.local:9000
    region: us-east-1
    credentialsSecretRef:
      name: shadow-diff-s3
    retentionPolicy: Retain

  # Shadow pods (control-a, control-b, candidate) — used when mode=replay
  oldImage: mendhak/http-https-echo:latest
  newImage: mendhak/http-https-echo:latest

  # Envoy ingress on shadow pods; Igris multicasts to control-* at this port (replay)
  servicePort: 8888
  # Must match the app listen port after Monarch copies prod env (HTTP_PORT=80 on echo)
  applicationPort: 80

  # Igris listen ports:
  #   80  — Kaisel/Igris captures (record) or replays (replay) prod traffic on dst port 80
  #   8888 — optional manual tests: curl igris:8888/get
  inputs:
    - port: 8888
      driver: http_request
