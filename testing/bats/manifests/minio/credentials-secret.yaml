# Credentials for ShadowTest.spec.storage.credentialsSecretRef (CR namespace = default).
# Matches MinIO root user from testing/bats/manifests/minio/deployment.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: shadow-diff-s3
  namespace: default
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: shadow-diff
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: admin
  AWS_SECRET_ACCESS_KEY: password
