# One-shot Job: create bucket shadow-diff-local on the local MinIO fixture.
# Applied by testing/tools/e2e-reset-minikube.sh (not by Monarch).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: monarch-system
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: shadow-diff
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-create-bucket
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: minio/mc:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            # Non-root (PSA restricted): mc defaults to /.mc which is not writable.
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio-service.monarch-system.svc.cluster.local:9000 admin password; do
                echo "waiting for minio..."
                sleep 2
              done
              mc mb --ignore-existing local/shadow-diff-local
              mc ls local/shadow-diff-local
