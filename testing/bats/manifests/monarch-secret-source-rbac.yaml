# Install-time RoleBinding so the manager can Get credentialsSecretRef in the
# ShadowTest CR namespace (default). ClusterRole is created by `make deploy`
# (namePrefix monarch- → monarch-secret-source-reader).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monarch-secret-source
  namespace: default
  labels:
    app.kubernetes.io/name: monarch
    app.kubernetes.io/part-of: shadow-diff
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monarch-secret-source-reader
subjects:
  - kind: ServiceAccount
    name: monarch-controller-manager
    namespace: monarch-system
