# In-cluster DNS plus a fixed NodePort, so the Go conformance suite can run from
# the host against the same database:
#   BERU_TEST_POSTGRES_DSN="postgres://beru:beru@localhost:15432/beru?sslmode=disable"
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: monarch-system
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shadow-diff
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
