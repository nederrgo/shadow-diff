# Reference env for http-rmq-python-prod when running the stress suite.
# Apply by patching the existing Deployment, or merge into your prod manifest.
# Also deploy: testing/bats/manifests/rabbitmq-otel-e2e/prod-user-service-python.yaml
#
#   kubectl set env deployment/http-rmq-python-prod \
#     HTTP_EGRESS_CONNECT_URL=http://user-service-python.default.svc.cluster.local:8080/v1/log \
#     HTTP_EGRESS_REPLAY_HOST=user-service.prod.internal
#
# Rebuild + reload the worker image after the HTTP-egress change:
#   make -C testing/example-apps/http-rmq-python-worker docker-build
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-rmq-python-prod
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: HTTP_EGRESS_CONNECT_URL
              value: http://user-service-python.default.svc.cluster.local:8080/v1/log
            - name: HTTP_EGRESS_REPLAY_HOST
              value: user-service.prod.internal
